[project]
name = "tftnet"
version = "0.1.0"
description = "TFT Set 18 as a network + game: CECS 427 final project"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "networkx>=3.0", "matplotlib>=3.7",
  "pyarrow>=14", "requests>=2.31", "pydantic>=2.5", "tabulate>=0.9",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
